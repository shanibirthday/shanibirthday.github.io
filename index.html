<style>
  :root {
    --bg0: #08111c;
    --bg1: #0c2a2c;
    --bg2: #15204a;
    --teal: #2dd4bf;
    --teal-deep: #0f766e;
    --gold: #f3c56b;
    --pink: #f472b6;
    --ink: #f7f4ee;
    --muted: rgba(247,244,238,.62);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg0); color: var(--ink); }
  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
    font-family: ui-rounded, "Segoe UI", "SF Pro Display", "Helvetica Neue", "Noto Sans Hebrew", "Arial Hebrew", system-ui, sans-serif;
    background:
      radial-gradient(900px 520px at 12% -8%, rgba(244,114,182,.20), transparent 55%),
      radial-gradient(820px 480px at 100% 0%, rgba(243,197,107,.16), transparent 50%),
      radial-gradient(900px 600px at 90% 110%, rgba(37,99,235,.28), transparent 52%),
      radial-gradient(700px 500px at 0% 100%, rgba(45,212,191,.20), transparent 50%),
      linear-gradient(165deg, var(--bg0) 0%, var(--bg1) 48%, var(--bg2) 100%);
    overflow: hidden;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 650;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--teal);
    margin: 0 0 16px;
  }
  .hero { text-align: center; margin-bottom: 28px; max-width: 22rem; }
  .hero h1 {
    margin: 0;
    font-size: clamp(1.7rem, 7.4vw, 2.15rem);
    font-weight: 700;
    letter-spacing: -.01em;
    line-height: 1.35;
    color: #fffaf3;
    text-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  .hero .en {
    margin: 8px 0 0;
    font-size: clamp(1rem, 4.2vw, 1.15rem);
    font-weight: 500;
    color: var(--gold);
  }
  .stage {
    position: relative;
    width: min(78vw, 300px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
  }
  .vinyl {
    position: absolute;
    width: 78%;
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, #f8e7c7 0 11%, #c9a36a 12%, #1a1d24 13%, #1a1d24 100%);
    box-shadow:
      0 22px 50px rgba(0,0,0,.4),
      0 0 0 1px rgba(243,197,107,.18),
      inset 0 0 0 10px #0d0f14,
      inset 0 0 40px rgba(45,212,191,.12);
    pointer-events: none;
  }
  .vinyl::before {
    content: "";
    position: absolute; inset: 12%;
    border-radius: 50%;
    background: repeating-radial-gradient(circle at 50% 50%,
      rgba(255,255,255,.05) 0 1px,
      transparent 2px 6px);
    opacity: .55;
  }
  .vinyl::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,.16), transparent 42%, rgba(45,212,191,.08) 70%, transparent);
  }
  .stage.is-playing .vinyl { animation: spin 3.6s linear infinite; }
  .ring {
    position: absolute; inset: 2.5%;
    transform: rotate(-90deg);
    pointer-events: none;
    overflow: visible;
  }
  .ring circle { fill: none; stroke-linecap: round; }
  .ring .track { stroke: rgba(255,255,255,.12); stroke-width: 5; }
  .ring .prog {
    stroke: url(#ringGrad);
    stroke-width: 5;
    stroke-linecap: butt;
    stroke-dasharray: 0 1000;
    filter: drop-shadow(0 0 5px rgba(45,212,191,.55));
  }
  .play {
    position: relative;
    z-index: 2;
    width: 132px; height: 132px;
    border: 0; border-radius: 50%;
    background: linear-gradient(180deg, #fffdf8, #efe3c8);
    color: #14262a;
    display: grid; place-items: center;
    cursor: pointer;
    box-shadow:
      0 14px 30px rgba(0,0,0,.28),
      0 0 0 7px rgba(45,212,191,.12);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    touch-action: manipulation;
  }
  .play:active { transform: scale(.96); }
  .play.ready:not(.playing) { animation: pulse 2.4s ease-in-out infinite; }
  .play.loading { filter: saturate(.75); }
  .play svg { width: 50px; height: 50px; display: block; }
  .play .pause, .play .eq { display: none; }
  .play.playing .play-icon { display: none; }
  .play.playing .pause { display: none; }
  .play.playing .eq { display: flex; }
  .eq {
    width: 52px; height: 42px;
    align-items: flex-end;
    justify-content: center;
    gap: 4px;
  }
  .eq i {
    display: block;
    width: 5px;
    height: 40%;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--teal-deep), #1e3a8a);
    transform-origin: bottom;
  }
  .stage.is-playing .eq i { animation: bar 0.85s ease-in-out infinite; }
  .eq i:nth-child(1) { animation-delay: -0.4s; height: 45%; }
  .eq i:nth-child(2) { animation-delay: -0.15s; height: 80%; }
  .eq i:nth-child(3) { animation-delay: -0.55s; height: 100%; }
  .eq i:nth-child(4) { animation-delay: -0.05s; height: 70%; }
  .eq i:nth-child(5) { animation-delay: -0.3s; height: 50%; }
  .row { margin-top: 22px; display: flex; gap: 14px; align-items: center; }
  .icon-btn {
    width: 50px; height: 50px;
    border: 0; border-radius: 50%;
    background: rgba(255,255,255,.08);
    color: var(--ink);
    cursor: pointer;
    display: grid; place-items: center;
    backdrop-filter: blur(8px);
    touch-action: manipulation;
  }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn svg { width: 22px; height: 22px; }
  .status {
    margin-top: 18px;
    min-height: 1.35em;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
  }
  .status.error { color: #fca5a5; }
  .hint {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: rgba(247,244,238,.38);
  }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 14px 30px rgba(0,0,0,.28), 0 0 0 7px rgba(45,212,191,.12); }
    50% { box-shadow: 0 14px 30px rgba(0,0,0,.28), 0 0 0 12px rgba(45,212,191,.22); }
  }
  @keyframes bar {
    0%, 100% { transform: scaleY(.45); }
    50% { transform: scaleY(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage.is-playing .vinyl, .play.ready:not(.playing), .stage.is-playing .eq i { animation: none; }
  }
</style>

  if (confettiDone) return;
  confettiDone = true;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("confetti");
  const ctx = c.getContext("2d");
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const W = c.width = Math.floor(innerWidth * dpr);
  const H = c.height = Math.floor(innerHeight * dpr);
  c.style.width = innerWidth + "px";
  c.style.height = innerHeight + "px";
  const colors = ["#2dd4bf", "#f3c56b", "#f472b6", "#a78bfa", "#38bdf8", "#fff6e8", "#fb7185"];
  const parts = [];
  const cx = W / 2, cy = H * 0.42;
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = 3.2 + Math.random() * 6.5;
    parts.push({
      x: cx, y: cy,
      vx: Math.cos(a) * v * dpr, vy: Math.sin(a) * v * dpr - 2 * dpr,
      g: 0.11 * dpr, w: (3 + Math.random() * 5) * dpr,
      h: (5 + Math.random() * 9) * dpr,
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.35,
      color: colors[i % colors.length], life: 1, kind: Math.random() < 0.45 ? "c" : "r"
    });
  }
  const t0 = performance.now();
  function frame(t) {
    const dt = Math.min(32, t - (frame.lt || t)); frame.lt = t;
    ctx.clearRect(0, 0, W, H);
    let alive = false;
    for (const p of parts) {
      p.vy += p.g * dt / 16;
      p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.rot += p.vr;
      p.life -= dt / 1400;
      if (p.life <= 0) continue;
      alive = true;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.kind === "c") { ctx.beginPath(); ctx.arc(0, 0, p.w * 0.55, 0, Math.PI * 2); ctx.fill(); }
      else { ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (alive && performance.now() - t0 < 1800) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}

async function unlock() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      audioCtx = audioCtx || new AC();
      if (audioCtx.state === "suspended") await audioCtx.resume();
    }
  } catch (e) {}
}

function playWhenReady() {
  const p = audio.play();
  setPlaying(true);
  setStatus("");
  burstConfetti();
  return p;
}

async function playClip() {
  if (!token) { setStatus("חסר קוד · Missing code", true); return; }
  if (loading) return;
  if (previewUrl && !audio.paused && !audio.ended) {
    audio.pause();
    setPlaying(false);
    return;
  }
  // Fast path: preview already armed — start audio in this tap, no await first.
  if (previewUrl && audio.src && audio.src.indexOf("http") === 0 && !audio.ended) {
    Promise.resolve(playWhenReady()).catch(() => { setPlaying(false); setStatus("לא ניתן לנגן · Can't play", true); });
    return;
  }
  if (previewUrl && audio.ended) {
    audio.currentTime = 0;
    Promise.resolve(playWhenReady()).catch(() => { setPlaying(false); setStatus("לא ניתן לנגן · Can't play", true); });
    return;
  }
  loading = true;
  playBtn.classList.add("loading");
  setStatus("…");
  try {
    await unlock();
    if (!previewUrl) {
      const url = await prefetchPromise.catch(() => fetchPreview());
      armAudio(url);
    } else if (audio.ended) {
      audio.currentTime = 0;
    }
    await playWhenReady();
  } catch (e) {
    setPlaying(false);
    setStatus("לא ניתן לנגן · Can't play", true);
  } finally {
    loading = false;
    playBtn.classList.remove("loading");
  }
}

async function replay() {
  if (!token) return;
  try {
    if (!previewUrl) await prefetchPromise;
    audio.currentTime = 0;
    await playWhenReady();
  } catch (e) {
    await playClip();
  }
}

playBtn.addEventListener("click", playClip);
replayBtn.addEventListener("click", replay);
if (!code) setStatus("חסר קוד · Missing code", true);
else if (!token) setStatus("קוד לא מוכר · Unknown code", true);
</script>
</body>
